<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketPad & Horizon Retro Gaming — Sovereign Handheld Systems</title>
  <script>
    // Smart Router: Redirect mobile/scanned devices to appropriate Controller
    (function() {
      const params = new URLSearchParams(window.location.search);
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 800;
      
      if (params.get('system') === 'snes' || (params.get('prefix') && params.get('prefix').includes('snes'))) {
        window.location.replace('snes-controller.html' + window.location.search);
        return;
      }

      if (params.has('room') || params.has('controller') || isMobile) {
        window.location.replace('controller.html' + window.location.search);
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      background: #07090e;
      color: #fff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #0f172a;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 16px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .title {
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      color: #38bdf8;
      line-height: 1.6;
    }
    .btn {
      display: block;
      padding: 12px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 12px;
      transition: all 0.2s;
    }
    .btn-snes {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      color: #fff;
      border: 1px solid #ef4444;
    }
    .btn-gb {
      background: linear-gradient(135deg, #059669, #0284c7);
      color: #fff;
      border: 1px solid #10b981;
    }
    .btn-tetris {
      background: #0284c7;
      color: #fff;
      border: 1px solid #38bdf8;
    }
    .btn-pad {
      background: rgba(255,255,255,0.06);
      color: #cbd5e1;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .btn:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">POCKETPAD & HORIZON ARCADE</div>
    <p style="font-size: 12px; color: #94a3b8; line-height: 1.5;">
      Sovereign browser-based retro gaming powered by WebRTC & WebAssembly.
    </p>
    <a href="snes-controller.html" class="btn btn-snes">🥊 Open PocketPad SNES 6-Button Arcade Pad</a>
    <a href="controller.html" class="btn btn-pad">📱 Open PocketPad Classic Game Boy Controller</a>
    <a href="emulator.html" class="btn btn-gb">🕹️ Launch Game Boy Vault (13 Classics)</a>
    <a href="game.html" class="btn btn-tetris">🎮 Open Big Screen Tetris</a>
  </div>
</body>
</html>
