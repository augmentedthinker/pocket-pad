<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketPad & Horizon Tetris — Sovereign Handheld Gaming</title>
  <script>
    // Smart Router: Redirect mobile/scanned devices to Controller, desktop screens to Game
    (function() {
      const params = new URLSearchParams(window.location.search);
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 800;
      
      if (params.has('room') || params.has('controller') || isMobile) {
        window.location.replace('controller.html' + window.location.search);
      } else {
        window.location.replace('game.html' + window.location.search);
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      background: #07090e;
      color: #fff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #0f172a;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 16px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .title {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: #38bdf8;
      line-height: 1.6;
    }
    .btn {
      display: block;
      padding: 14px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      transition: all 0.2s;
    }
    .btn-game {
      background: #0284c7;
      color: #fff;
      border: 1px solid #38bdf8;
    }
    .btn-pad {
      background: rgba(255,255,255,0.06);
      color: #cbd5e1;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .btn:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">POCKETPAD & HORIZON TETRIS</div>
    <p style="font-size: 13px; color: #94a3b8; line-height: 1.5;">
      Redirecting to your optimal experience... Choose your mode below:
    </p>
    <a href="game.html" class="btn btn-game">🎮 Open Big Screen Tetris (Desktop / TV)</a>
    <a href="controller.html" class="btn btn-pad">📱 Open PocketPad Controller (Mobile)</a>
  </div>
</body>
</html>
